# data_yaml: native labelled targets select checkpoints and drive final evaluation:
# DAIR-V2X uses official eval; UA-DETRAC uses its labelled official test.
# coco_data_root / detr_dataset_class / num_classes are shared by DETR-style runners.
datasets:
  dairv2x:
    aliases:
      - DAIR-V2X_YOLO
      - dair-v2x
    report_protocol: dairv2x
    data_yaml: "/root/autodl-fs/datasets/DAIR-V2X_YOLO/dairv2x.yaml"
    coco_data_root: "/root/autodl-fs/datasets/DAIR-V2X"
    detr_dataset_class: "DAIRV2XDetection"
    num_classes: 8
    class_names:
      - Car
      - Truck
      - Van
      - Bus
      - Pedestrian
      - Cyclist
      - Motorcyclist
      - Trafficcone

  uadetrac:
    aliases:
      - ua-detrac
      - UADETRAC_YOLO
      - UA-DETRAC_YOLO
    report_protocol: uadetrac
    data_yaml: "/root/autodl-fs/datasets/UA-DETRAC_YOLO/data.yaml"
    coco_data_root: "/root/autodl-fs/datasets/UA-DETRAC_COCO"
    detr_dataset_class: "CocoFolderDetection"
    num_classes: 4
    class_names:
      - car
      - van
      - bus
      - others

  dawn:
    aliases:
      - DAWN_YOLO
      - DAWN
    data_yaml: "/root/autodl-fs/datasets/DAWN_YOLO/dawn_all.yaml"
    coco_data_root: "/root/autodl-fs/datasets/DAWN_COCO"
    detr_dataset_class: "CocoFolderDetection"
    num_classes: 7
    class_names:
      - car
      - truck
      - person
      - bus
      - motorcycle
      - bicycle
      - train
