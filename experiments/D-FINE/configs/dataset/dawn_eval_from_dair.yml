# Standalone entry for DAWN cross-domain evaluation using a DAIR-V2X-trained checkpoint.
#
# Usage:
#   python train.py -c configs/dataset/dawn_eval_from_dair.yml --test-only \
#     -r outputs/<your_dair_ckpt>/best_stg2.pth
#
# __include__: later overrides earlier.
#   1. dfine_hgnetv2_s_dairv2x.yml supplies model + DAIR train/val dataloaders.
#      Vehicle5 is the project default; pass --dairv2x-vehicle8 for this 8-class DAWN
#      cross-domain evaluation.
#   2. dawn_detection.yml then replaces evaluator (cross_domain_label_map) and
#      val_dataloader (full DAWN train+val) -- train_dataloader remains DAIR's,
#      unused under --test-only but referenced by some config-time hooks.
__include__: [
  '../dfine/dfine_hgnetv2_s_dairv2x.yml',
  './dawn_detection.yml',
]

output_dir: ./outputs/dawn_eval_from_dair
