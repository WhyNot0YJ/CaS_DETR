__include__: [
  './cas_deim.yml'
]

# Hybrid decoder shared block: narrow token-routed experts on some layers and a
# full-width dense FFN on the rest.  The dense FFN (1024) matches the pretrained
# width and is loaded through the normal `tuning` path; the 128-wide experts are
# width-mismatched, so upcycling skips them and they stay random.
# Each experiment sets `moe_layer_indices` to choose the placement.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dense_dim_feedforward: 1024
  moe_dim_feedforward: 128

DEIMCriterion:
  decoder_moe_balance_weight: 0.005
