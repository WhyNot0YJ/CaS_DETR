__include__: [
  './cas_deim.yml'
]

# CaS-DETR main decoder: a pretrained dense foundation layer followed by two
# narrow token-routed expert layers for iterative refinement.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  moe_layer_indices: [1, 2]
  dense_dim_feedforward: 1024
  moe_dim_feedforward: 128

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

# V-MoE-style dense-to-expert upcycling. Each narrow expert starts from the
# most salient neurons of the corresponding COCO-pretrained dense FFN.
moe_ffn_init:
  source: pretrained/deim_dfine_hgnetv2_s_coco_120e.pth
