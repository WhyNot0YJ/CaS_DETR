__include__: [
  './cas_deim.yml'
]

# Two active 512-wide experts match the dense 1024-wide FFN compute per token.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dense_dim_feedforward: 1024
  moe_dim_feedforward: 512

DEIMCriterion:
  decoder_moe_balance_weight: 0.005
