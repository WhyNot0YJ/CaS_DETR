__include__: [
  './cas_deim.yml'
]

# Paper-aligned full CaS-DETR anchor: all three decoder layers are MoE with
# random (Xavier) experts.  `moe_symmetry_break_std` is left unset so the
# capacity scan (0.5x/1x/2x/4x, which overrides `dim_feedforward`) stays random
# and varies exactly one factor.  Stack `base/cas_detr_moe_upcycle.yml` on the
# width-matched 4x anchor to load the pretrained dense FFN instead.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 1024

DEIMCriterion:
  decoder_moe_balance_weight: 0.005
