__include__: [
  './cas_deim.yml'
]

# Paper-aligned full CaS-DETR anchor.  Dataset-specific experiment configs
# inherit this block and override only the factor being ablated.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 1024

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

moe_ffn_init:
  source: pretrained/deim_dfine_hgnetv2_s_coco_120e.pth
