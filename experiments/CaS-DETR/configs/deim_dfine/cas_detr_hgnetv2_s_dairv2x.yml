__include__: [
  './deim_hgnetv2_s_dairv2x.yml',
  '../base/cas_deim.yml'
]

output_dir: ./outputs/cas_detr_hgnetv2_s_dairv2x

HybridEncoder:
  token_keep_ratio: 0.3
  use_caip: True
  use_cass: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 128

DEIMCriterion:
  decoder_moe_balance_weight: 0.005
