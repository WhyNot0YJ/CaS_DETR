__include__: [
  './cas_detr_moe_cap2x_hgnetv2_s_uadetrac.yml'
]

# CASS + SG-CCFF control on UA-DETRAC, without decoder MoE.
output_dir: ./outputs/uadetrac/main/cas_detr_cass_sg_ccff_cap2x_hgnetv2_s

HybridEncoder:
  enable_cas_predictor: True
  use_cass: True
  enable_sg_ccff: True

DFINETransformer:
  use_moe: False
  moe_layer_indices: null
  dim_feedforward: 1024

DEIMCriterion:
  decoder_moe_balance_weight: 0.0
