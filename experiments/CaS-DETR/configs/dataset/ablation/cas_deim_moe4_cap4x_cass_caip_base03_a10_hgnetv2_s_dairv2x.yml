__include__: [
  '../../deim_dfine/deim_hgnetv2_s_dairv2x.yml',
  '../../base/cas_deim.yml'
]

output_dir: ./outputs/ablation/cas_deim_moe4_cap4x_cass_caip_base03_a10_hgnetv2_s_dairv2x

# MoE capacity scan: 4 * 1024 / 1024 = 4x the dense FFN parameter count.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 1024

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

train_dataloader:
  total_batch_size: 16
  num_workers: 8

val_dataloader:
  total_batch_size: 16
  num_workers: 8
