__include__: [
  '../../../deim_dfine/deim_hgnetv2_s_dairv2x.yml',
  '../../../base/cas_deim.yml'
]

output_dir: ./outputs/ablation/cas_deim_moe4_cap1x_cass_base03_a10_hgnetv2_s_dairv2x

# MoE 总参数量扫描（1x = 与普通单 FFN 等参数量）
# 倍数定义：MoE 层总参数 / 普通单 FFN 参数 = num_experts * dim_feedforward / dim_ff_baseline
#         = 4 * 256 / 1024 = 1.0
# 普通 FFN baseline: d_model=256, dim_feedforward=1024
# 当前配置: num_experts=4, dim_feedforward=256 -> 总参数与普通 FFN 相同（每个专家容量 1/4）
# 用于回答：在总参数预算与普通 FFN 持平的前提下，MoE 是否仍优于稠密 FFN？

HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  cass_complexity_alpha: 1.0
  cass_dynamic_warmup_epochs: 4
  use_cass: True
  cass_predictor_variant: global_context

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 256  # 1x（每个专家 FFN 中间层维度，4 个专家合计参数 = 普通 FFN 1024）

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

train_dataloader:
  total_batch_size: 16
  num_workers: 8

val_dataloader:
  total_batch_size: 16
  num_workers: 8
