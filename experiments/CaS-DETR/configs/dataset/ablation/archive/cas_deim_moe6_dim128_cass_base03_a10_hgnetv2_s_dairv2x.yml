__include__: [
  '../../../deim_dfine/deim_hgnetv2_s_dairv2x.yml',
  '../../../base/cas_deim.yml'
]

output_dir: ./outputs/ablation/cas_deim_moe6_dim128_cass_base03_a10_hgnetv2_s_dairv2x

# Expert-count scan: keep top_k and per-expert width fixed across 3/4/6 experts.
HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  cass_complexity_alpha: 1.0
  cass_dynamic_warmup_epochs: 4
  use_cass: True
  cass_predictor_variant: global_context

DFINETransformer:
  use_moe: True
  num_experts: 6
  moe_top_k: 2
  dim_feedforward: 128

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

train_dataloader:
  total_batch_size: 16
  num_workers: 8

val_dataloader:
  total_batch_size: 16
  num_workers: 8
