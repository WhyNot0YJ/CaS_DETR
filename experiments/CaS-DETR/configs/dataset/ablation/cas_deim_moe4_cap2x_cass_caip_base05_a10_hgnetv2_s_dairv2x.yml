__include__: [
  '../../deim_dfine/deim_hgnetv2_s_dairv2x.yml',
  '../../base/cas_deim.yml'
]

output_dir: ./outputs/ablation/cas_deim_moe4_cap2x_cass_caip_base05_a10_hgnetv2_s_dairv2x

# MoE 总参数量扫描（2x = 普通单 FFN 的 2 倍参数量）
# 倍数定义：MoE 层总参数 / 普通单 FFN 参数 = num_experts * dim_feedforward / dim_ff_baseline
#         = 4 * 512 / 1024 = 2.0
# 当前配置: num_experts=4, dim_feedforward=512 -> 4 个专家合计 = 普通 FFN 的 2 倍
# 介于 cap1x（与稠密等参）和 cap4x（当前默认）之间，用于绘 capacity-vs-mAP 曲线中间点。

HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.5
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 512  # 2x（每个专家 FFN 中间层维度，4 个专家合计 = 普通 FFN 2 倍参数）

DEIMCriterion:
  decoder_moe_balance_weight: 0.005
