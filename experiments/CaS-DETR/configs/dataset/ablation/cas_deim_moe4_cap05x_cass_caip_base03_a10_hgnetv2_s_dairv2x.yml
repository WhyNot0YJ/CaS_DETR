__include__: [
  '../../deim_dfine/deim_hgnetv2_s_dairv2x.yml',
  '../../base/cas_deim.yml'
]

output_dir: ./outputs/ablation/cas_deim_moe4_cap05x_cass_caip_base03_a10_hgnetv2_s_dairv2x

# MoE 总参数量扫描（0.5x = 普通单 FFN 的一半参数量）
# 倍数定义：MoE 层总参数 / 普通单 FFN 参数 = num_experts * dim_feedforward / 1024
#         = 4 * 128 / 1024 = 0.5
# 当前配置: num_experts=4, dim_feedforward=128 -> 4 个专家合计 = 普通 FFN 的 50%
# 极端下界：每个专家是 256->128->256 的"压缩瓶颈"FFN（hidden < input）
# 用于回答：在严重低于稠密 FFN 参数量时，路由稀疏性能否撑住精度？

HybridEncoder:
  enable_cas_predictor: True
  token_keep_ratio: 0.3
  use_caip: True
  caip_complexity_alpha: 1.0
  caip_dynamic_warmup_epochs: 4
  use_cass: True

DFINETransformer:
  use_moe: True
  num_experts: 4
  moe_top_k: 2
  dim_feedforward: 128  # 0.5x（每个专家 FFN 中间层维度，4 个专家合计 = 普通 FFN 的 1/2 参数）

DEIMCriterion:
  decoder_moe_balance_weight: 0.005

train_dataloader:
  total_batch_size: 16
  num_workers: 8

val_dataloader:
  total_batch_size: 16
  num_workers: 8
