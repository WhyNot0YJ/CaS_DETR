# Layer order [MoE, MoE, Dense]: MoE on layers 0-1 for input-adaptive
# refinement, dense on layer 2 (the eval layer) so the final box regression
# keeps the deterministic, fully pretrained FFN.
DFINETransformer:
  moe_layer_indices: [0, 1]
